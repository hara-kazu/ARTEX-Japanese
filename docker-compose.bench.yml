# ARTEX Tencent TSec Benchmark 評価イメージ —— ローカルでワンクリック build + run。
# 本番用 docker-compose.yml(複数サービス:artex+postgres)とは相互に影響しない。
# 使用方法：
#   cp bench/.env.example bench/.env   # LLM_API_KEY / BENCHMARK_TOKEN などを入力
#   docker compose -f docker-compose.bench.yml up --build      # ビルドしてフォアグラウンド実行(ログ表示)
#   docker compose -f docker-compose.bench.yml up --build -d   # バックグラウンド
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # 停止(-v 付きならデータボリュームも削除)
# ブラウザー：http://localhost:8787（ADMIN_PASSWORD でログイン）

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # 物理マシンとネットワークを共有：コンテナーがホストのネットワークスタックを直接使い、ホスト/VPN のターゲットネットワークへ直接接続できる。
    # host モードでは ports マッピングを使わず、コンテナーがホストのポートを直接使う：8787(UI/API)、8788(プロキシ)、
    # 内部 PostgreSQL 5432 —— この3ポートがホストで空いていることを確認する（ローカルテスト前に使用中のサービスを停止）。
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
